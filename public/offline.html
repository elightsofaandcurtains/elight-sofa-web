<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Elight Sofa House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2D2926 0%, #4A4543 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            color: #D4AF37;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            background: #D4AF37;
            color: #2D2926;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .features {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature {
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .feature-title {
            font-weight: 600;
            color: #D4AF37;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, you can still browse previously viewed
            pages.</p>
        <a href="/" class="button" onclick="window.location.reload(); return false;">Try Again</a>

        <div class="features">
            <div class="feature">
                <div class="feature-title">✨ Premium Furniture</div>
                <div>Luxury sofas, chairs, tables & more</div>
            </div>
            <div class="feature">
                <div class="feature-title">🎨 Custom Designs</div>
                <div>Tailored to your vision</div>
            </div>
            <div class="feature">
                <div class="feature-title">🏆 Since 2015</div>
                <div>Trusted by thousands</div>
            </div>
        </div>
    </div>

    <script>
        // Auto-retry connection every 5 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);

        // Listen for online event
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
